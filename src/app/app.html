<div class="shell">
  <header class="topbar">
    <p class="brand">{{ i18n.t('app.title') }}</p>

    <div class="controls">
      <label class="control">
        {{ i18n.t('language.label') }}
        <select [value]="i18n.language()" (change)="onLanguageChange($event)">
          @for (language of i18n.languages; track language.code) {
            <option [value]="language.code" [disabled]="!language.available">
              {{ language.nativeLabel }}
              @if (!language.available) {
                ({{ i18n.t('language.comingSoon') }})
              }
            </option>
          }
        </select>
      </label>

      <label class="control">
        {{ i18n.t('theme.label') }}
        <select [value]="theme.preference()" (change)="onThemeChange($event)">
          @for (preference of theme.preferences; track preference) {
            <option [value]="preference">{{ i18n.t(themeLabel(preference)) }}</option>
          }
        </select>
      </label>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
